<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Park It</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --asphalt: #1a1a1e;
    --road: #2a2a30;
    --lane: #f5c518;
    --wall: #c0392b;
    --spot: #27ae60;
    --hud: rgba(10,10,14,0.85);
    --accent: #f5c518;
    --danger: #e74c3c;
    --success: #2ecc71;
    --car: #3498db;
  }

  body {
    background: var(--asphalt);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Share Tech Mono', monospace;
    color: white;
    overflow: hidden;
  }

  #title {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.4rem;
    font-weight: 900;
    letter-spacing: 0.4em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(245,197,24,0.5);
  }

  #game-wrapper {
    position: relative;
    border: 2px solid #333;
    box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 60px rgba(0,0,0,0.4);
  }

  canvas {
    display: block;
  }

  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 800px;
    background: var(--hud);
    padding: 8px 20px;
    border-top: 1px solid #333;
  }

  .hud-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .hud-label {
    font-size: 0.55rem;
    color: #888;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .hud-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent);
  }

  #controls-hint {
    font-size: 0.6rem;
    color: #555;
    margin-top: 8px;
    letter-spacing: 0.1em;
  }

  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }

  #overlay.visible {
    opacity: 1;
    background: rgba(0,0,0,0.6);
  }

  #overlay-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 3.5rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    text-shadow: 0 0 30px currentColor;
  }

  #overlay-sub {
    font-size: 1rem;
    margin-top: 16px;
    color: #ccc;
    letter-spacing: 0.2em;
  }

  #overlay-time {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.4rem;
    margin-top: 10px;
    color: var(--accent);
  }

  /* Scanline effect */
  #game-wrapper::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.04) 2px,
      rgba(0,0,0,0.04) 4px
    );
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="title">🅿 Park It</div>

<div id="game-wrapper">
  <canvas id="gameCanvas" width="800" height="530"></canvas>

  <div id="overlay">
    <div id="overlay-title">–</div>
    <div id="overlay-time"></div>
    <div id="overlay-sub">–</div>
  </div>

  <div id="hud">
    <div class="hud-item">
      <span class="hud-label">Level</span>
      <span class="hud-value" id="hud-level">1</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Time</span>
      <span class="hud-value" id="hud-time">00:00</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Best</span>
      <span class="hud-value" id="hud-best">--:--</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Speed</span>
      <span class="hud-value" id="hud-speed">0.0</span>
    </div>
  </div>
</div>

<div id="controls-hint">↑↓ ACCELERATE / REVERSE &nbsp;|&nbsp; ←→ STEER &nbsp;|&nbsp; R RESTART &nbsp;|&nbsp; ENTER NEXT LEVEL</div>

<script>
// ─────────────────────────────────────────────
// MODEL
// ─────────────────────────────────────────────

class Car {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.angle = 0;
    this.speed = 0;
    this.acceleration = 0.10;
    this.friction = 0.02;
    this.turnSpeed = 2.8;
    this.width = 40;
    this.height = 20;
  }

  move() {
    this.x += Math.cos(this.angle * Math.PI / 180) * this.speed;
    this.y += Math.sin(this.angle * Math.PI / 180) * this.speed;
    if (this.speed > 0) this.speed -= this.friction;
    else if (this.speed < 0) this.speed += this.friction;
    if (Math.abs(this.speed) < this.friction) this.speed = 0;
  }

  accelerate() { this.speed += this.acceleration; }
  reverse()    { this.speed -= this.acceleration; }
  turnLeft()   { if (this.speed !== 0) this.angle -= this.turnSpeed * Math.sign(this.speed); }
  turnRight()  { if (this.speed !== 0) this.angle += this.turnSpeed * Math.sign(this.speed); }

  getBounds() {
    // Return corners for rotated rectangle collision
    const cx = this.x + this.width / 2;
    const cy = this.y + this.height / 2;
    const hw = this.width / 2;
    const hh = this.height / 2;
    const rad = this.angle * Math.PI / 180;
    const cos = Math.cos(rad);
    const sin = Math.sin(rad);
    const corners = [
      [-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]
    ];
    return corners.map(([lx, ly]) => ({
      x: cx + lx * cos - ly * sin,
      y: cy + lx * sin + ly * cos
    }));
  }

  getAABB() {
    return { x: this.x, y: this.y, w: this.width, h: this.height };
  }

  setPosition(x, y) {
    this.x = x; this.y = y;
    this.speed = 0; this.angle = 0;
  }
}

class GameTimer {
  constructor() { this.reset(); }
  start() { this.startTime = Date.now() - this.elapsed; this.running = true; }
  stop()  { if (this.running) { this.elapsed = Date.now() - this.startTime; this.running = false; } }
  reset() { this.startTime = 0; this.elapsed = 0; this.running = false; }
  getElapsed() { return this.running ? Date.now() - this.startTime : this.elapsed; }
  getFormatted() {
    const ms = this.getElapsed();
    const s  = Math.floor(ms / 1000);
    const cs = Math.floor((ms % 1000) / 10);
    return `${String(s).padStart(2,'0')}:${String(cs).padStart(2,'0')}`;
  }
}

class PlayerStats {
  constructor() {
    this.currentLevel = 1;
    this.bestTimes = Array(5).fill(Infinity);
  }
  updateBestTime(level, time) {
    const i = level - 1;
    if (i >= 0 && i < this.bestTimes.length && time < this.bestTimes[i]) {
      this.bestTimes[i] = time;
    }
  }
  getBestTime(level) { return this.bestTimes[level - 1]; }
  formatTime(ms) {
    if (!isFinite(ms)) return '--:--';
    const s  = Math.floor(ms / 1000);
    const cs = Math.floor((ms % 1000) / 10);
    return `${String(s).padStart(2,'0')}:${String(cs).padStart(2,'0')}`;
  }
}

class GameModel {
  constructor() {
    this.car = new Car(100, 100);
    this.stats = new PlayerStats();
    this.timer = new GameTimer();
    this.obstacles = [];
    this.parkingSpot = null;
    this.crashed = false;
    this.success = false;
    this.observers = [];
    this.currentLevel = 1;
    this.loadLevel(1);
  }

  addObserver(obs) { this.observers.push(obs); }
  notifyObservers() { this.observers.forEach(o => o.update()); }

  loadLevel(level) {
    this.currentLevel = level;
    this.stats.currentLevel = level;
    this.car.setPosition(60, 60);
    this.timer.reset();
    this.crashed = false;
    this.success = false;
    this.obstacles = [];

    if (level === 1) {
      // A wall dividing the screen, parking spot bottom-right
      this.obstacles.push({ x: 200, y: 0,   w: 20, h: 300 });
      this.obstacles.push({ x: 0,   y: 350,  w: 350, h: 20 });
      this.parkingSpot = { x: 620, y: 420, w: 70, h: 35 };
    } else if (level === 2) {
      this.obstacles.push({ x: 150, y: 120, w: 300, h: 20 });
      this.obstacles.push({ x: 150, y: 300, w: 300, h: 20 });
      this.obstacles.push({ x: 500, y: 120, w: 20, h: 200 });
      this.obstacles.push({ x: 0,   y: 200, w: 120, h: 20 });
      this.parkingSpot = { x: 580, y: 220, w: 70, h: 35 };
    } else {
      // Level 3 — harder maze
      this.obstacles.push({ x: 100, y: 100, w: 20, h: 250 });
      this.obstacles.push({ x: 100, y: 100, w: 200, h: 20 });
      this.obstacles.push({ x: 300, y: 200, w: 20, h: 280 });
      this.obstacles.push({ x: 400, y: 100, w: 250, h: 20 });
      this.obstacles.push({ x: 500, y: 100, w: 20, h: 200 });
      this.obstacles.push({ x: 400, y: 300, w: 150, h: 20 });
      this.parkingSpot = { x: 600, y: 380, w: 70, h: 35 };
    }

    this.notifyObservers();
  }

  update() {
    if (!this.crashed && !this.success) {
      if (!this.timer.running) this.timer.start();
      this.car.move();
      this.checkCollisions();
      this.notifyObservers();
    }
  }

  rectIntersects(a, bx, by, bw, bh) {
    return a.x < bx + bw && a.x + a.w > bx &&
           a.y < by + bh && a.y + a.h > by;
  }

  rectContains(outer, inner) {
    return inner.x >= outer.x && inner.y >= outer.y &&
           inner.x + inner.w <= outer.x + outer.w &&
           inner.y + inner.h <= outer.y + outer.h;
  }

  checkCollisions() {
    const aabb = this.car.getAABB();

    for (const obs of this.obstacles) {
      if (this.rectIntersects(aabb, obs.x, obs.y, obs.w, obs.h)) {
        this.crashed = true;
        this.timer.stop();
        this.notifyObservers();
        return;
      }
    }

    const sp = this.parkingSpot;
    if (this.rectContains({ x: sp.x, y: sp.y, w: sp.w, h: sp.h }, aabb)) {
      // Must be slow to count
      if (Math.abs(this.car.speed) < 1.5) {
        this.success = true;
        this.timer.stop();
        this.stats.updateBestTime(this.currentLevel, this.timer.getElapsed());
        this.notifyObservers();
      }
    }

    // Boundary
    if (this.car.x < 0 || this.car.x + this.car.width > 800 ||
        this.car.y < 0 || this.car.y + this.car.height > 530) {
      this.crashed = true;
      this.timer.stop();
      this.notifyObservers();
    }
  }
}

// ─────────────────────────────────────────────
// VIEW
// ─────────────────────────────────────────────

class ParkingLotView {
  draw(ctx, model) {
    // Background
    ctx.fillStyle = '#22222a';
    ctx.fillRect(0, 0, 800, 530);

    // Road grid texture
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < 800; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 530); ctx.stroke();
    }
    for (let y = 0; y < 530; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(800, y); ctx.stroke();
    }

    // Parking spot
    const sp = model.parkingSpot;
    // Glow
    ctx.shadowColor = '#27ae60';
    ctx.shadowBlur = 15;
    ctx.strokeStyle = '#2ecc71';
    ctx.lineWidth = 2;
    ctx.strokeRect(sp.x, sp.y, sp.w, sp.h);
    ctx.shadowBlur = 0;

    // Fill
    ctx.fillStyle = 'rgba(46,204,113,0.12)';
    ctx.fillRect(sp.x, sp.y, sp.w, sp.h);

    // Corner markers
    ctx.fillStyle = '#2ecc71';
    const m = 4;
    [[sp.x,sp.y],[sp.x+sp.w-m,sp.y],[sp.x,sp.y+sp.h-m],[sp.x+sp.w-m,sp.y+sp.h-m]].forEach(([cx,cy]) => {
      ctx.fillRect(cx, cy, m, m);
    });

    // P label
    ctx.fillStyle = 'rgba(46,204,113,0.4)';
    ctx.font = 'bold 18px Orbitron, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('P', sp.x + sp.w/2, sp.y + sp.h/2 + 7);
    ctx.textAlign = 'left';

    // Obstacles
    for (const obs of model.obstacles) {
      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(obs.x + 3, obs.y + 3, obs.w, obs.h);

      // Striped wall pattern
      const grad = ctx.createLinearGradient(obs.x, obs.y, obs.x + obs.w, obs.y + obs.h);
      grad.addColorStop(0, '#c0392b');
      grad.addColorStop(0.5, '#e74c3c');
      grad.addColorStop(1, '#922b21');
      ctx.fillStyle = grad;
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);

      // Hazard stripe overlay
      ctx.save();
      ctx.clipRect = () => {};
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = 'black';
      const stripeW = 10;
      for (let i = -obs.h; i < obs.w + obs.h; i += stripeW * 2) {
        ctx.beginPath();
        ctx.moveTo(obs.x + i, obs.y);
        ctx.lineTo(obs.x + i + stripeW, obs.y);
        ctx.lineTo(obs.x + i + stripeW - obs.h, obs.y + obs.h);
        ctx.lineTo(obs.x + i - obs.h, obs.y + obs.h);
        ctx.closePath();
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();

      // Border
      ctx.strokeStyle = '#7b241c';
      ctx.lineWidth = 1;
      ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
    }
  }
}

class CarView {
  draw(ctx, car) {
    const cx = car.x + car.width / 2;
    const cy = car.y + car.height / 2;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(car.angle * Math.PI / 180);

    // Car shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(-car.width/2 + 3, -car.height/2 + 3, car.width, car.height);

    // Car body
    const bodyGrad = ctx.createLinearGradient(-car.width/2, -car.height/2, car.width/2, car.height/2);
    bodyGrad.addColorStop(0, '#5dade2');
    bodyGrad.addColorStop(0.5, '#3498db');
    bodyGrad.addColorStop(1, '#1a5276');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.roundRect(-car.width/2, -car.height/2, car.width, car.height, 4);
    ctx.fill();

    // Roof
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    ctx.roundRect(-car.width/2 + 6, -car.height/2 + 3, car.width - 18, car.height - 6, 3);
    ctx.fill();

    // Headlights (front = positive angle direction)
    ctx.fillStyle = '#f9e79f';
    ctx.shadowColor = '#f9e79f';
    ctx.shadowBlur = 8;
    ctx.fillRect(car.width/2 - 5, -car.height/2 + 2, 5, 5);
    ctx.fillRect(car.width/2 - 5, car.height/2 - 7, 5, 5);
    ctx.shadowBlur = 0;

    // Tail lights
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(-car.width/2, -car.height/2 + 2, 4, 5);
    ctx.fillRect(-car.width/2, car.height/2 - 7, 4, 5);

    // Speed lines if moving fast
    if (Math.abs(car.speed) > 1.5) {
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1;
      for (let i = -1; i <= 1; i++) {
        const len = Math.abs(car.speed) * 5;
        ctx.beginPath();
        ctx.moveTo(-car.width/2, i * 5);
        ctx.lineTo(-car.width/2 - len, i * 5);
        ctx.stroke();
      }
    }

    ctx.restore();
  }
}

// ─────────────────────────────────────────────
// CONTROLLER
// ─────────────────────────────────────────────

class InputController {
  constructor() {
    this.keys = {};
    window.addEventListener('keydown', e => {
      this.keys[e.key] = true;
      e.preventDefault();
    });
    window.addEventListener('keyup', e => {
      this.keys[e.key] = false;
    });
  }

  update(model) {
    if (this.keys['ArrowUp']    || this.keys['w']) model.car.accelerate();
    if (this.keys['ArrowDown']  || this.keys['s']) model.car.reverse();
    if (this.keys['ArrowLeft']  || this.keys['a']) model.car.turnLeft();
    if (this.keys['ArrowRight'] || this.keys['d']) model.car.turnRight();
  }

  handleSpecial(e, model, onRestart, onNextLevel) {
    if (e.key === 'r' || e.key === 'R') {
      onRestart();
    }
    if ((e.key === 'Enter') && model.success) {
      onNextLevel();
    }
  }
}

// ─────────────────────────────────────────────
// MAIN
// ─────────────────────────────────────────────

const canvas  = document.getElementById('gameCanvas');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const oTitle  = document.getElementById('overlay-title');
const oSub    = document.getElementById('overlay-sub');
const oTime   = document.getElementById('overlay-time');
const hudLevel = document.getElementById('hud-level');
const hudTime  = document.getElementById('hud-time');
const hudBest  = document.getElementById('hud-best');
const hudSpeed = document.getElementById('hud-speed');

const model      = new GameModel();
const lotView    = new ParkingLotView();
const carView    = new CarView();
const controller = new InputController();

const MAX_LEVEL = 3;

function restart() {
  model.loadLevel(model.currentLevel);
  overlay.classList.remove('visible');
}

function nextLevel() {
  const next = model.currentLevel < MAX_LEVEL ? model.currentLevel + 1 : 1;
  model.loadLevel(next);
  overlay.classList.remove('visible');
}

model.addObserver({
  update() {
    hudLevel.textContent = model.currentLevel;
    hudTime.textContent  = model.timer.getFormatted();
    hudBest.textContent  = model.stats.formatTime(model.stats.getBestTime(model.currentLevel));
    hudSpeed.textContent = Math.abs(model.car.speed).toFixed(1);

    if (model.crashed) {
      oTitle.style.color = '#e74c3c';
      oTitle.textContent = 'CRASHED!';
      oSub.textContent   = 'Press R to Restart';
      oTime.textContent  = '';
      overlay.classList.add('visible');
    } else if (model.success) {
      oTitle.style.color = '#2ecc71';
      oTitle.textContent = model.currentLevel < MAX_LEVEL ? 'PARKED!' : 'YOU WIN!';
      oTime.textContent  = 'Time: ' + model.timer.getFormatted();
      oSub.textContent   = model.currentLevel < MAX_LEVEL
        ? 'Press Enter for Next Level'
        : 'Press R to Play Again';
      overlay.classList.add('visible');
    }
  }
});

window.addEventListener('keydown', e => {
  controller.handleSpecial(e, model, restart, nextLevel);
});

function gameLoop() {
  controller.update(model);
  model.update();

  // Draw
  lotView.draw(ctx, model);
  carView.draw(ctx, model.car);

  // HUD time live update
  if (!model.crashed && !model.success) {
    hudTime.textContent = model.timer.getFormatted();
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
